# LOCAL DEVELOPMENT ONLY — never used in production.
# Production targets Amazon RDS PostgreSQL (private subnet, no public access).
# The password below is a throwaway local dev password; it is NOT any real
# credential and must never be reused anywhere else.
services:
  db:
    image: postgres:16-alpine
    container_name: mini-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: mini_erp_dev_password
      POSTGRES_DB: mini_erp
    ports:
      - "5432:5432"
    volumes:
      - mini_erp_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_erp -d mini_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mini_erp_pgdata: